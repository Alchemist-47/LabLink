# Render Blueprint: free web service built from the Dockerfile.
# Dashboard → New → Blueprint → pick this repo. You'll be asked for GEMINI_API_KEY.
services:
  - type: web
    name: lablink
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true    # random, generated by Render; never stored in git
      - key: GEMINI_API_KEY
        sync: false            # entered in the dashboard at deploy time
      - key: LABLINK_STORAGE
        value: memory
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CAMPUS_TZ
        value: Asia/Kolkata
